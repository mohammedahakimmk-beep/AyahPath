name: ayahpath
description: "AyahPath - Your Personalized Path to Learning the Quran. An adaptive, offline-first Quran learning companion."
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  permission_handler: ^12.0.0
  path_provider: ^2.1.6
  # Vendored locally (third_party/flutter_whisper) because the published
  # package omits miniaudio.h (the microphone/decoder header its JNI bridge
  # needs). We patch in the missing header so whisper.cpp compiles on-device.
  flutter_whisper:
    path: third_party/flutter_whisper
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_database: ^12.5.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

  assets:
    - assets/quran/quran.json
    - assets/models/tarteel-q8.bin
